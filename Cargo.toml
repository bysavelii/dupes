[package]
name = "dupes"
version = "0.0.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
