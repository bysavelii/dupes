[package]
name = "dupes"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
